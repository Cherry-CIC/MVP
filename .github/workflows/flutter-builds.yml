name: Flutter builds

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: Firebase environment to build
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev

permissions:
  contents: read

jobs:
  build-android:
    name: Android (${{ inputs.environment || (github.ref_name == 'main' && 'prod' || 'dev') }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || (github.ref_name == 'main' && 'prod' || 'dev') }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve build environment
        id: config
        shell: bash
        run: |
          app_env="${{ inputs.environment || (github.ref_name == 'main' && 'prod' || 'dev') }}"
          echo "app_env=$app_env" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure stable CI debug keystore
        shell: bash
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Android APK
        env:
          APP_ENV: ${{ steps.config.outputs.app_env }}
        run: flutter build apk --debug --flavor "$APP_ENV" --dart-define=APP_ENV="$APP_ENV"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: cherry-android-${{ steps.config.outputs.app_env }}-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-${{ steps.config.outputs.app_env }}-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Authenticate for Firebase App Distribution
        if: github.event_name != 'pull_request'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Node.js
        if: github.event_name != 'pull_request'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase CLI
        if: github.event_name != 'pull_request'
        run: npm install --global firebase-tools

      - name: Publish Android APK to Firebase App Distribution
        if: github.event_name != 'pull_request'
        env:
          APP_ENV: ${{ steps.config.outputs.app_env }}
        run: |
          if [[ "$APP_ENV" == "dev" ]]; then
            app_id="1:401854471349:android:a4c4ddc4dbe5319585f2fc"
          else
            app_id="1:166746898861:android:7393858dd30a6241aca124"
          fi

          firebase appdistribution:distribute \
            "build/app/outputs/flutter-apk/app-${APP_ENV}-debug.apk" \
            --app "$app_id" \
            --release-notes "${APP_ENV} build ${GITHUB_SHA::7}"

  build-ios-simulator:
    name: iOS simulator (${{ inputs.environment || (github.ref_name == 'main' && 'prod' || 'dev') }})
    runs-on: macos-14
    environment: ${{ inputs.environment || (github.ref_name == 'main' && 'prod' || 'dev') }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Resolve build environment
        id: config
        shell: bash
        run: |
          app_env="${{ inputs.environment || (github.ref_name == 'main' && 'prod' || 'dev') }}"
          echo "app_env=$app_env" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Use CocoaPods for iOS plugins
        run: flutter config --no-enable-swift-package-manager

      - name: Install dependencies
        run: flutter pub get

      - name: Keep iOS project on CocoaPods
        run: |
          git restore --source=HEAD -- ios/Runner.xcodeproj/project.pbxproj
          if grep -q 'FlutterGeneratedPluginSwiftPackage' ios/Runner.xcodeproj/project.pbxproj; then
            echo 'Swift Package Manager integration is still present in the iOS project'
            exit 1
          fi

      - name: Build unsigned iOS simulator app
        env:
          APP_ENV: ${{ steps.config.outputs.app_env }}
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme "$APP_ENV" \
            -configuration "Debug-${APP_ENV}" \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios/ci \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package iOS simulator app
        run: |
          cd "build/ios/ci/Build/Products/Debug-${{ steps.config.outputs.app_env }}-iphonesimulator"
          zip -r "cherry-ios-${{ steps.config.outputs.app_env }}-simulator.zip" Runner.app

      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: cherry-ios-${{ steps.config.outputs.app_env }}-simulator-${{ github.run_number }}
          path: build/ios/ci/Build/Products/Debug-${{ steps.config.outputs.app_env }}-iphonesimulator/cherry-ios-${{ steps.config.outputs.app_env }}-simulator.zip
          if-no-files-found: error
          retention-days: 30
