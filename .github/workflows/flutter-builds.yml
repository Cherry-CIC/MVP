name: Flutter builds

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: Firebase environment to build
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev

permissions:
  contents: read

jobs:
  build-android:
    name: Android (${{ inputs.environment || (github.ref_name == 'main' && 'prod' || 'dev') }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || (github.ref_name == 'main' && 'prod' || 'dev') }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve build environment
        id: config
        shell: bash
        run: |
          app_env="${{ inputs.environment || (github.ref_name == 'main' && 'prod' || 'dev') }}"
          echo "app_env=$app_env" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure stable CI debug keystore
        shell: bash
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Android APK
        env:
          APP_ENV: ${{ steps.config.outputs.app_env }}
        run: flutter build apk --debug --flavor "$APP_ENV" --dart-define=APP_ENV="$APP_ENV"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: cherry-android-${{ steps.config.outputs.app_env }}-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-${{ steps.config.outputs.app_env }}-debug.apk
          if-no-files-found: error
          retention-days: 30

  build-ios-simulator:
    name: iOS simulator (${{ inputs.environment || (github.ref_name == 'main' && 'prod' || 'dev') }})
    runs-on: xcode-27
    environment: ${{ inputs.environment || (github.ref_name == 'main' && 'prod' || 'dev') }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve build environment
        id: config
        shell: bash
        run: |
          app_env="${{ inputs.environment || (github.ref_name == 'main' && 'prod' || 'dev') }}"
          echo "app_env=$app_env" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Use Swift Package Manager for iOS plugins
        run: flutter config --enable-swift-package-manager

      - name: Prepare Flutter iOS plugin directory
        run: mkdir -p build/ios/SourcePackages

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare iOS Swift packages
        run: flutter precache --ios

      - name: Build unsigned iOS simulator app
        env:
          APP_ENV: ${{ steps.config.outputs.app_env }}
        run: |
          xcodebuild \
            -project ios/Runner.xcodeproj \
            -scheme Runner \
            -configuration "Debug-${APP_ENV}" \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios/ci \
            -clonedSourcePackagesDirPath build/ios/SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package iOS simulator app
        run: |
          cd "build/ios/ci/Build/Products/Debug-${{ steps.config.outputs.app_env }}-iphonesimulator"
          zip -r "cherry-ios-${{ steps.config.outputs.app_env }}-simulator.zip" Runner.app

      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: cherry-ios-${{ steps.config.outputs.app_env }}-simulator-${{ github.run_number }}
          path: build/ios/ci/Build/Products/Debug-${{ steps.config.outputs.app_env }}-iphonesimulator/cherry-ios-${{ steps.config.outputs.app_env }}-simulator.zip
          if-no-files-found: error
          retention-days: 30
