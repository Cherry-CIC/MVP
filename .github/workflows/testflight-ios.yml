name: iOS TestFlight Distribution

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: iOS release configuration
        required: true
        type: choice
        options:
          - Release-dev
          - Release-prod
        default: Release-dev

permissions:
  contents: read

jobs:
  distribute-ios:
    name: TestFlight (${{ inputs.configuration }})
    runs-on: xcode-27
    environment: ${{ endsWith(inputs.configuration, '-prod') && 'prod' || 'dev' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve build configuration
        id: config
        shell: bash
        env:
          CONFIGURATION: ${{ inputs.configuration }}
        run: |
          case "$CONFIGURATION" in
            Release-dev) app_env=dev ;;
            Release-prod) app_env=prod ;;
            *) echo "Only Release-dev and Release-prod can be uploaded to TestFlight" >&2; exit 1 ;;
          esac
          echo "configuration=$CONFIGURATION" >> "$GITHUB_OUTPUT"
          echo "app_env=$app_env" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Use Swift Package Manager for iOS plugins
        run: flutter config --enable-swift-package-manager

      - name: Prepare iOS Swift packages
        run: |
          mkdir -p build/ios/SourcePackages
          flutter pub get
          flutter precache --ios

      - name: Prepare App Store Connect API key
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          test -n "$APPSTORE_API_PRIVATE_KEY" || { echo "Missing APPSTORE_API_PRIVATE_KEY" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/appstore"
          printf '%s' "$APPSTORE_API_PRIVATE_KEY" > "$RUNNER_TEMP/appstore/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/appstore/AuthKey.p8"

      - name: Archive iOS app
        env:
          CONFIGURATION: ${{ steps.config.outputs.configuration }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          test -n "$APPSTORE_KEY_ID" || { echo "Missing APPSTORE_KEY_ID" >&2; exit 1; }
          test -n "$APPSTORE_ISSUER_ID" || { echo "Missing APPSTORE_ISSUER_ID" >&2; exit 1; }
          test -n "$APPLE_TEAM_ID" || { echo "Missing APPLE_TEAM_ID" >&2; exit 1; }

          xcodebuild \
            -project ios/Runner.xcodeproj \
            -scheme Runner \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=iOS' \
            -archivePath "build/ios/archive/Cherry-${CONFIGURATION}.xcarchive" \
            -clonedSourcePackagesDirPath build/ios/SourcePackages \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/appstore/AuthKey.p8" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            archive

      - name: Export App Store IPA
        id: export
        env:
          CONFIGURATION: ${{ steps.config.outputs.configuration }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key><string>export</string>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "build/ios/archive/Cherry-${CONFIGURATION}.xcarchive" \
            -exportPath build/ios/export \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/appstore/AuthKey.p8" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"

          ipa_path="$(find build/ios/export -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -n "$ipa_path" || { echo "No exported IPA found" >&2; exit 1; }
          echo "ipa_path=$ipa_path" >> "$GITHUB_OUTPUT"

      - name: Upload build to TestFlight
        uses: apple-actions/upload-testflight-build@v2
        with:
          app-path: ${{ steps.export.outputs.ipa_path }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: cherry-ios-${{ steps.config.outputs.app_env }}-testflight-${{ github.run_number }}
          path: ${{ steps.export.outputs.ipa_path }}
          if-no-files-found: error
          retention-days: 30
