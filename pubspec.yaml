name: cherry_mvp
description: Cherry MVP
version: 0.1.0+7

environment:
  sdk: '^3.12.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  firebase_storage: ^13.4.2
  cloud_firestore: ^6.5.0
  cloud_functions: ^6.3.2
  cupertino_icons: ^1.0.9
  shared_preferences: ^2.5.5
  provider: ^6.1.5+1
  fluttertoast: ^9.1.0
  logging: ^1.3.0
  image_picker: ^1.2.2
  flutter_dotenv: ^6.0.1
  google_sign_in: ^7.2.0
  fl_chart: ^1.2.0
  google_fonts: ^8.1.0
  mask_text_input_formatter: ^2.9.0
  flutter_svg: ^2.3.0
  dio: ^5.9.2
  pretty_dio_logger: ^1.4.0
  json_annotation: ^4.12.0
  http: ^1.6.0
  flutter_stripe: ^12.6.0
  flutter_native_splash: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.7.0
  flutter_lints: ^6.0.0
  json_serializable: ^6.14.0
  build_runner: ^2.15.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
    - assets/legal/
    - .env
  config:
    enable-swift-package-manager: false

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the assets and other descriptors for the font. For
  # example:
  fonts:
    - family: Raleway
      fonts:
        - asset: assets/fonts/Raleway-Light.ttf
          weight: 300
        - asset: assets/fonts/Raleway-Thin.ttf
          weight: 300
        - asset: assets/fonts/Raleway-Regular.ttf
          weight: 400
        - asset: assets/fonts/Raleway-Medium.ttf
          weight: 500
        - asset: assets/fonts/Raleway-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Raleway-Bold.ttf
          weight: 700
        - asset: assets/fonts/Raleway-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Raleway-Black.ttf
          weight: 900
        - asset: assets/fonts/Raleway-BlackItalic.ttf
          style: italic
        - asset: assets/fonts/Raleway-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Raleway-BlackItalic.ttf
          weight: 900
          style: italic

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icon/icon.png
  android: true
  ios: true
  android_12:
    image: assets/icon/icon.png
    icon_background_color: "#FFFFFF"
