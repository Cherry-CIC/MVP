name: cherry_mvp
description: Cherry MVP
version: 0.1.1+10

environment:
  sdk: '^3.12.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  firebase_storage: ^14.0.1
  cloud_firestore: ^7.1.0
  cloud_functions: ^7.0.1
  cupertino_icons: ^2.0.0
  shared_preferences: ^2.5.6
  provider: ^6.1.5+1
  fluttertoast: ^10.0.2
  image_picker: ^1.2.4
  app_settings: ^9.0.1
  permission_handler: ^12.0.3
  flutter_dotenv: ^6.0.1
  google_sign_in: ^7.2.0
  fl_chart: ^1.3.0
  google_fonts: ^8.1.0
  mask_text_input_formatter: ^2.9.0
  flutter_svg: ^2.3.2
  dio: ^5.11.1
  json_annotation: ^4.12.0
  http: ^1.6.0
  flutter_stripe: ^14.2.0
  flutter_native_splash: ^2.4.8
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.8.1
  flutter_lints: ^6.0.0
  json_serializable: ^6.15.2
  build_runner: ^2.16.2
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
    - assets/legal/
    - .env.dev
    - .env.prod
  config:
    enable-swift-package-manager: true

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the assets and other descriptors for the font. For
  # example:
  fonts:
    - family: InstrumentSansPricing
      fonts:
        - asset: assets/fonts/InstrumentSans-Bold.ttf
          weight: 700
    - family: Raleway
      fonts:
        - asset: assets/fonts/Raleway-Light.ttf
          weight: 300
        - asset: assets/fonts/Raleway-Thin.ttf
          weight: 300
        - asset: assets/fonts/Raleway-Regular.ttf
          weight: 400
        - asset: assets/fonts/Raleway-Medium.ttf
          weight: 500
        - asset: assets/fonts/Raleway-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Raleway-Bold.ttf
          weight: 700
        - asset: assets/fonts/Raleway-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Raleway-Black.ttf
          weight: 900
        - asset: assets/fonts/Raleway-BlackItalic.ttf
          style: italic
        - asset: assets/fonts/Raleway-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Raleway-BlackItalic.ttf
          weight: 900
          style: italic

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icon/icon.png
  android: true
  ios: true
  android_12:
    image: assets/icon/icon.png
    icon_background_color: "#FFFFFF"
